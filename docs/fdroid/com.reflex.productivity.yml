AutoName: Reflex
Summary: Calm, local-first routines, tasks, habits, focus, and calendar
Description: |-
  Reflex is a calm, local-first productivity assistant for Android designed
  around tactile design, frosted glass aesthetics, and absolute privacy.

  Features:
  * Step-by-step sequential routines with audio cues and starter templates
  * Smart tasks with priority levels (P1-P4), recurrence, and exact alarms
  * Daily habit tracking with numeric goals, annual heatmaps, and streak statistics
  * Deep focus timers with Pomodoro, interval, and open flow sessions
  * Distraction shield with app blocking overlay
  * Unified daily calendar linking routines, tasks, and device calendars
  * 100% offline with zero network permissions and full local JSON backup

