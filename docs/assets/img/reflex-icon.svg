<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background subtle radial glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1F1814" />
      <stop offset="70%" stop-color="#0E0C0B" />
      <stop offset="100%" stop-color="#060504" />
    </radialGradient>
    
    <!-- Copper gradient -->
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C2A8" />
      <stop offset="50%" stop-color="#D9A184" />
      <stop offset="100%" stop-color="#A86E53" />
    </linearGradient>

    <!-- Warm inner ambient glow -->
    <filter id="copperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#2E2A27" stroke-width="2" opacity="0.4" />

  <!-- Outer Ring with top-right gap: 
       Center at (256, 256), Radius ~140.
       Arc from 70 deg (bottom right) around through bottom, left, top to 30 deg.
  -->
  <g filter="url(#copperGlow)">
    <!-- Liquid inside circle with clip path -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="132" />
    </clipPath>
    
    <!-- Liquid wave -->
    <g clip-path="url(#circleClip)">
      <path d="M 120 256 Q 185 205, 256 265 T 392 250 L 392 400 L 120 400 Z" fill="url(#copperGrad)" />
      <!-- Top highlight rim on wave -->
      <path d="M 120 256 Q 185 205, 256 265 T 392 250" fill="none" stroke="#FFF0E8" stroke-width="3" opacity="0.6" />
    </g>

    <!-- Open Ring stroke: center 256, 256, r=138, stroke=24 -->
    <!-- Arc from ~55 degrees (around (335, 369)) around to ~15 degrees (around (389, 292)) -->
    <!-- Or simple stroke with stroke-dasharray and dashoffset -->
    <circle cx="256" cy="256" r="138" fill="none" stroke="url(#copperGrad)" stroke-width="24" stroke-linecap="round"
            stroke-dasharray="780 120" stroke-dashoffset="-30" />

    <!-- Satellite Copper Dot at ~2 o'clock -->
    <circle cx="356" cy="180" r="23" fill="url(#copperGrad)" />
    <circle cx="354" cy="177" r="16" fill="#FFF0E8" opacity="0.25" />
  </g>
</svg>
