name: Bug Report
description: File a bug report or unexpected behavior in Reflex
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you are running the latest version of Reflex.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Tap on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: input
    id: device-info
    attributes:
      label: Device & OS
      description: e.g. Google Pixel 8, Android 15
      placeholder: "Device model, Android version"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Reflex Version
      description: Found in Reflex Settings > About
      placeholder: "1.0.0 (build 1)"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context / Screenshots
      description: Add any other context or attach screenshots if applicable.
